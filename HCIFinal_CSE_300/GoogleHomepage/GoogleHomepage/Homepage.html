<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Google page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,700,0,0">
    <link rel="stylesheet" href="./css/index-main.css">
    <link rel="stylesheet" href="./css/search-form.css">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <header>
        <nav class="nav-bar header-item left">
            <div class="nav-list">
                <a href="" target="_self" speak5="Open About menu">About</a>
                <a href="" target="_self" speak4="Open Store menu">Store</a>
            </div>
        </nav>
        <nav class="nav-bar header-item left">
            <div class="nav-list">
                <a href="" target="_self" speak3="Open gmail menu">Gmail</a>
                <a href="" target="_self" speak6="Open Images menu">Images</a>
                <button type="button" class="button apps-button" aria-label="Open apps menu" speak1="Open apps menu">
                    <span class="material-symbols-outlined apps-icon" aria-label="Open apps menu">apps</span>
                    <span class="tooltip">Click me</span>
                </button>
                <a href="" target="_self" class="sign-in-button" speak2="Open sign in menu">Sign in</a>
            </div>
        </nav>
    </header>

    <main>
        <h1>
            <img src="images/HalloweenGoogle.png" alt="Google" class="google-logo" />
        </h1>
        <form class="search-form">
            <div class="form-group">
                <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
                <input type="text" class="search-input" name="searchInput" aria-label="Search" id="search-input"
                    required />
                <button type="button" class="button google-mic-button">
                    <img src="images/google-mic.png" alt="Search by voice" class="google-mic" />
                    <span class="tooltip">Search by voice</span>
                </button>
                <button type="button" class="button google-camera-button">
                    <img src="images/google-camera.png" alt="Search by image" class="google-camera" />
                    <span class="tooltip">Search by image</span>
                </button>
            </div>
            <div class="button-group">
                <button type="submit" class="button search-button">Google Search</button>
                <a href="" target="_self" class="button search-button">I'm Feeling Lucky</a>
            </div>
        </form>
    </main>

    <footer>
        <nav class="nav-bar footer-item">
            <div class="nav-list">
                <a href="" target="_self" speak7="Open Advertising menu">Advertising</a>
                <a href="" target="_self" speak8="Open Business menu">Business</a>
                <a href="" target="_self" speak9="Open HSW menu">How Search works</a>
            </div>
        </nav>
        <nav class="nav-bar footer-item">
            <div class="footer-item carbon-neutral-link">
                <img src="images/green-leaf.png" alt="" class="green-leaf" />
                <a href="" target="_self">Carbon neutral since 2007</a>
            </div>
        </nav>
        <nav class="nav-bar footer-item">
            <div class="nav-list">
                <a href="" target="_self" speak10="Open Privacy menu">Privacy</a>
                <a href="" target="_self" speak11="Open Terms menu">Terms</a>
                <a href="" target="_self" speak12="Open Settings menu">Settings</a>
            </div>
        </nav>
    </footer>

    <script type="text/javascript" src="script.js"></script>
</body>

</html>
