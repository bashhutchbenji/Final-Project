<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Psychology Spin Wheel</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="container">
    <div class="pointer"></div>
    <div id="wheel" class="wheel"></div>
  </div>
  <button id="spinBtn">SPIN</button>
  <div id="result">Click “SPIN” to start.</div>
  <div class="checkboxes">
  <h3>Select Colors:</h3>
  <div id="coloroptions">
    <label><input type="checkbox" value="Red" checked> Red</label>
    <label><input type="checkbox" value="Orange" checked> Orange</label>
    <label><input type="checkbox" value="Yellow" checked> Yellow</label>
    <label><input type="checkbox" value="Green" checked> Green</label>
    <br>
    <label><input type="checkbox" value="Blue" checked> Blue</label>
    <label><input type="checkbox" value="Purple" checked> Purple</label>
    <label><input type="checkbox" value="Pink" checked> Pink</label>
    <label><input type="checkbox" value="White" checked> White</label>
    <br>
    <label><input type="checkbox" value="Black" checked> Black</label>
    <label><input type="checkbox" value="Grey" checked> Grey</label>
  </div>
</div>
  <script src="./js/script.js"></script>
</body>

</html>
