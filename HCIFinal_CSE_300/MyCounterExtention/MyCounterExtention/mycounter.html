<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" , content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/styles.css">
    <title>My Counter</title>
</head>

<body>
    <div class="wrap">
        <section class="card">
            <h1>Counter</h1>
            <div id="count" class="value">0</div>
            <div>
                <button id="desc10">
                    COUNT -10
                </button>
                <button id="desc">
                    COUNT -1
                </button>
                <button id="reset">
                    RESET
                </button>
                <button id="incs">
                    COUNT +1
                </button>
                <button id="incs10">
                    COUNT +10
                </button>
            </div>
        </section>
    </div>
    <script src="index.js"></script>
</body>

</html>
